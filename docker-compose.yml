services:
  redis:
    image: redis:7-alpine
    container_name: polyglot_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-dotnet
      dockerfile: Dockerfile
    container_name: polyglot_backend
    environment:
      - REDIS_URL=redis:6379
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5000:5000"
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ./worker-python
      dockerfile: Dockerfile
    container_name: polyglot_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-js
      dockerfile: Dockerfile
    container_name: polyglot_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

networks:
  default:
    name: polyglot_network