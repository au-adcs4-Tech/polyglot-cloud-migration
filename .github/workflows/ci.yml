name: CI Pipeline

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/polyglot-backend
  WORKER_IMAGE:  ${{ secrets.DOCKER_USERNAME }}/polyglot-worker
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/polyglot-frontend

jobs:
  # ─── TEST .NET BACKEND ─────────────────────────────────────────────────────
  test-backend:
    name: Test .NET Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore backend-dotnet/src/PolyglotApi/PolyglotApi.csproj

      - name: Format check
        run: dotnet format backend-dotnet/src/PolyglotApi/PolyglotApi.csproj --verify-no-changes

      - name: Run tests
        run: dotnet test backend-dotnet/tests/PolyglotApi.Tests/PolyglotApi.Tests.csproj --logger "console;verbosity=normal"

  # ─── TEST PYTHON WORKER ───────────────────────────────────────────────────
  test-worker:
    name: Test Python Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r worker-python/requirements.txt ruff

      - name: Lint with ruff
        run: ruff check worker-python/src/

      - name: Run tests
        run: pytest worker-python/tests/ -v

  # ─── TEST JS FRONTEND ─────────────────────────────────────────────────────
  test-frontend:
    name: Test JS Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-js/package-lock.json

      - name: Install dependencies
        working-directory: frontend-js
        run: npm ci

      - name: Lint
        working-directory: frontend-js
        run: npm run lint

      - name: Run tests
        working-directory: frontend-js
        run: npm test

  # ─── BUILD & PUSH DOCKER IMAGES ──────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-worker, test-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/'))

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend-dotnet
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build & push worker
        uses: docker/build-push-action@v5
        with:
          context: ./worker-python
          push: true
          tags: ${{ env.WORKER_IMAGE }}:latest,${{ env.WORKER_IMAGE }}:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-js
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      # ─── Trigger Jenkins CD ──────────────────────────────────────────────
      - name: Trigger Jenkins deployment
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X POST \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            "${{ secrets.JENKINS_URL }}/job/polyglot-deploy/build" \
            --data-urlencode json='{"parameter": [{"name":"GIT_SHA","value":"${{ github.sha }}"}]}'
